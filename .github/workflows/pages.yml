# GitHub Pages に index.html をデプロイする。
# Repository Settings → Secrets: NN_GAS_EXEC_URL（/exec で終わる Web アプリ URL）
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare site
        env:
          NN_GAS_EXEC_URL: ${{ secrets.NN_GAS_EXEC_URL }}
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          node scripts/inject-pages-gas-config.cjs _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
